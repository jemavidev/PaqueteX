[pytest]
# Suite del rebuild PaqueteXv.2 (dominio + capa web). Los tests viejos
# (CUFE/facturas/productos/parser y tests/test_public_routes_fix.py) están fuera
# de alcance y NO se recogen: testpaths lista solo las carpetas del rebuild.
# El arnés compartido (fixtures de Postgres efímero) vive en tests/conftest.py +
# tests/_harness.py; por eso `tests` está en pythonpath (para `import _harness`).
#
# `tests/browser` (Chromium real con Playwright, `.scratch/captura-guia-lector-camara`,
# ticket 02) está en testpaths para que `pytest -m browser` lo encuentre, pero `addopts`
# deselecciona ese marcador: un `pytest` sin marcador NO lo corre. Un `-m` en la línea de
# comandos pisa este (gana el último), así que `pytest -m browser` corre SOLO esas pruebas.
# Cómo correrlas y qué necesitan: docstring de tests/browser/conftest.py.
testpaths = tests/data_model tests/web tests/infra tests/browser
pythonpath = src tests
addopts = -m "not browser"
markers =
    integration: requiere un Postgres efímero construido con `alembic upgrade head`
    browser: prueba en navegador real (Chromium + Playwright); no corre en la suite por defecto, ver tests/browser/conftest.py

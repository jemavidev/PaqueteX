{% extends "base.html" %}
{% block title %}Alta de staff — PAQUETEX{% endblock %}
{% block head %}
<style>
  :root { --brand:#1f6feb; --err:#c0392b; --ok:#1e7a35; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin:0; background:#f5f6f8; color:#1a1a1a; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input, select { width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; font-size:1rem; background:#fff; }
  button { width:100%; margin-top:20px; padding:14px; background:var(--brand); color:#fff; border:0; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; }
  .error { background:#fdecea; color:var(--err); border-radius:8px; padding:12px; margin-bottom:12px; }
  .ok { background:#e3f7e8; color:var(--ok); border-radius:8px; padding:12px; margin-bottom:12px; }
</style>
{% endblock %}
{% block content %}
<div class="wrap">
  <h1>Dar de alta staff</h1>
  <div class="card">
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    {% if creado %}<div class="ok">Cuenta creada: {{ creado.email }} ({{ creado.rol.value }}).</div>{% endif %}
    <form method="post" action="/administracion/personal">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email|default('') }}" autocomplete="off">

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" value="{{ nombre|default('') }}">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="new-password">

      <label for="rol">Rol</label>
      <select id="rol" name="rol">
        {% for r in roles %}
        <option value="{{ r.value }}">{{ r.value }}</option>
        {% endfor %}
      </select>

      <button type="submit">Crear cuenta</button>
    </form>
  </div>
</div>
{% endblock %}

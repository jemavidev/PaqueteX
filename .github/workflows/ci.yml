name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paquetex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Con TEST_DATABASE_URL definido, el arnés no usa docker: corre contra el
      # service:postgres efímero de arriba.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paquetex_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==8.3.4 httpx==0.25.2

      - name: Tests (esquema construido con `alembic upgrade head`)
        run: pytest -v

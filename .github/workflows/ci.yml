name: CI & Deploy to Staging

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  STAGING_HOST: 52.6.204.211
  STAGING_DOMAIN: test.papyrus.com.co
  STAGING_USER: ubuntu
  PROJECT_PATH: /home/ubuntu/app/PaqueteX

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paquetex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Con TEST_DATABASE_URL definido, el arnés no usa docker: corre contra el
      # service:postgres efímero de arriba.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paquetex_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==8.3.4 httpx==0.25.2

      - name: Tests (esquema construido con `alembic upgrade head`)
        run: pytest -v

  deploy:
    needs: tests
    # Antes "Deploy to Staging" era un workflow aparte, disparado por el mismo
    # push que CI -- corrían en paralelo (mismo run_started_at), así que un
    # commit con tests rotos se desplegaba igual, sin esperar el resultado de
    # CI. `needs: tests` + este `if` (que excluye pull_request, ya que ahí no
    # hay nada que desplegar) cierran esa carrera.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull + rebuild (solo si hace falta) + migrate + restart
        # Bind-mount de código (docker-compose.yml, 2026-08-19, pedido
        # explícito): el contenedor `app` monta `./src`/`./alembic` del
        # propio checkout del host -- después de `git reset --hard`, un
        # simple `restart` YA sirve el código fresco (CMD del Dockerfile
        # corre `alembic upgrade head` en cada arranque, así que las
        # migraciones tampoco se pierden). Solo hace falta `--build`
        # cuando cambia algo que la imagen necesita hornear de nuevo:
        # dependencias (requirements.txt), la propia receta de build
        # (Dockerfile), o la definición de servicios (docker-compose.yml).
        # `$BEFORE` es el SHA que este server tenía ANTES de este deploy
        # (no `github.event.before` -- ese es el `push` de GitHub, puede
        # no coincidir si un deploy anterior falló a mitad de camino).
        run: |
          ssh -i ~/.ssh/staging_key ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            cd ${{ env.PROJECT_PATH }} &&
            BEFORE=\$(git rev-parse HEAD) &&
            git fetch origin &&
            git reset --hard origin/main &&
            if git diff --name-only \$BEFORE HEAD | grep -qE '^(requirements\.txt|Dockerfile|docker-compose\.yml)\$'; then
              echo 'Cambio de dependencias/imagen -- rebuild completo' &&
              sudo docker compose --env-file .env up -d --build
            else
              echo 'Solo código/plantillas -- restart sin rebuild (bind-mount)' &&
              sudo docker compose --env-file .env restart app
            fi
          "

      # PASO TEMPORAL -- pedido explícito del cliente 2026-08-19, correr UNA
      # sola vez: limpia paquetes/residentes/personas/fotos de prueba
      # acumulados, preserva staff + catálogo de apartamentos (ver
      # scripts/reset_test_data.sql). Se retira en el commit siguiente para
      # que NUNCA vuelva a correr en un deploy normal -- el .sql se queda en
      # el repo como herramienta manual reusable si hace falta de nuevo.
      - name: "[TEMPORAL] Reset de datos de prueba -- correr una sola vez"
        run: |
          ssh -i ~/.ssh/staging_key ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            cd ${{ env.PROJECT_PATH }} &&
            cat scripts/reset_test_data.sql | sudo docker compose exec -T db psql -U paquetex -d paquetex
          "

      - name: Health check
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -sf https://${{ env.STAGING_DOMAIN }}/health | grep -q ok; then
              echo "Deploy OK"
              exit 0
            fi
            echo "Intento $attempt/5, esperando..."
            sleep 8
          done
          echo "Health check no confirmó — revisar logs en el servidor"
          exit 1

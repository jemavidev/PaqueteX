services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: paquetex
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paquetex"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Bind-mount de código (2026-08-19, pedido explícito): el `Dockerfile`
    # sigue haciendo `COPY src/ src/`/`COPY alembic/ alembic/` -- la imagen
    # queda self-contained igual (se puede correr suelta, sin este mount).
    # Este mount es una capa aparte, SOLO de este despliegue: le gana al
    # contenido copiado (Docker monta encima), así que el contenedor sirve
    # el código FRESCO del propio checkout del host en cada `git reset
    # --hard` -- sin reconstruir la imagen. `:ro` porque el contenedor
    # nunca debe escribir de vuelta al checkout del host. `ci.yml` decide
    # cuándo hace falta `--build` de verdad (cambios en requirements.txt/
    # Dockerfile/docker-compose.yml) vs. un simple `restart` (código o
    # plantillas -- éste, con el mount, ya alcanza).
    volumes:
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro
      # Llave SSH restringida + known_hosts para app/infra/deploy_ssh.py
      # (issues 04/06, .scratch/administracion-proveedores/spec.md) -- viven
      # FUERA de este checkout a propósito (/home/ubuntu/paquetex-provider-
      # ssh/, nunca en git). known_hosts va a /etc/ssh/ssh_known_hosts
      # (paramiko.load_system_host_keys() lo carga solo, sin variable de
      # entorno nueva) -- RejectPolicy en el código cliente falla cerrado si
      # este archivo no está o no coincide.
      - /home/ubuntu/paquetex-provider-ssh/id_ed25519:/run/deploy-ssh/id_ed25519:ro
      - /home/ubuntu/paquetex-provider-ssh/known_hosts:/etc/ssh/ssh_known_hosts:ro
    # El contenedor le habla por SSH al MISMO host que lo corre (issue 06) --
    # `host.docker.internal` es el mecanismo nativo de Docker para que un
    # contenedor alcance a su host, más robusto que depender de que la IP
    # pública del servidor haga hairpin NAT hacia sí misma.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 2026-08-10: WEB_ENV=staging retirado -- pedido explícito del cliente,
      # este servidor (test.papyrus.com.co) deja de comportarse como
      # "staging" porque empieza a usarse para pruebas con clientes reales.
      # Sin este valor, StagingOverrideSender (app/web/notifications.py) y
      # StagingOverrideEmailSender (app/web/password_reset.py) dejan de
      # envolver el sender real -- SMS y correo llegan al destinatario real,
      # no a SMS_OVERRIDE_NUMBER/EMAIL_OVERRIDE_ADDRESS.
      DATABASE_URL: postgresql://paquetex:${PG_PASSWORD}@db:5432/paquetex
      SECRET_KEY: ${SECRET_KEY}
      # Número de WhatsApp/teléfono de soporte para el footer (Ayuda/WhatsApp/
      # Teléfono) -- mismo número que ya publica producción. Sin esta
      # variable esos dos enlaces simplemente no se muestran (nunca un link
      # roto) -- ver whatsapp_soporte_numero() en app/web/config.py.
      WHATSAPP_SOPORTE_NUMERO: ${WHATSAPP_SOPORTE_NUMERO}
      # Override fail-closed (StagingOverrideSender): sin esta variable, cero
      # envíos aunque haya un proveedor real conectado. Definida en .env local.
      SMS_OVERRIDE_NUMBER: ${SMS_OVERRIDE_NUMBER}
      # Credenciales LIWA (conector real de SMS) — definidas en .env local, NO
      # versionadas. Sin estas, la app cae sola a Console/DevOtpSender.
      LIWA_API_KEY: ${LIWA_API_KEY}
      LIWA_ACCOUNT: ${LIWA_ACCOUNT}
      LIWA_PASSWORD: ${LIWA_PASSWORD}
      LIWA_AUTH_URL: ${LIWA_AUTH_URL}
      # Credenciales Twilio (respaldo de SMS si LIWA no responde) — definidas
      # en .env local, NO versionadas. Sin las tres, Twilio no entra a la
      # cadena de precedencia (ver twilio_sender.configurado()).
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID}
      # AWS SNS (tercer respaldo de SMS). El rol IAM de la instancia vive en
      # una cuenta AWS distinta a la nuestra (sin acceso) — se usa un usuario
      # IAM dedicado en nuestra cuenta, con permiso exclusivo sns:Publish
      # (condicionado a sns:Protocol=sms), en vez del rol de la instancia.
      AWS_SNS_SMS_ENABLED: ${AWS_SNS_SMS_ENABLED}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      # SSH restringido para aplicar credenciales de proveedores desde
      # /administracion/proveedores (issue 04/06) -- DEPLOY_SSH_HOST literal
      # (host.docker.internal, el propio servidor vía Docker, no `${...}`):
      # es inherente a ESTE despliegue, igual que PUBLIC_BASE_URL más abajo.
      # DEPLOY_SSH_KEY_PATH literal también -- coincide con la ruta del
      # mount de arriba, no algo que cambie entre entornos. DEPLOY_SSH_USER
      # SÍ viene de `.env` (mismo usuario "ubuntu" que ya usa ci.yml, pero
      # sin repetir el literal en dos lugares del repo de deploy).
      DEPLOY_SSH_HOST: host.docker.internal
      DEPLOY_SSH_USER: ${DEPLOY_SSH_USER}
      DEPLOY_SSH_KEY_PATH: /run/deploy-ssh/id_ed25519
      # Credenciales de WhatsApp (Meta) y Llamadas (PBX Issabel) -- issues
      # 289-291, .scratch/pendientes-cliente. Sin `Sender` real detrás
      # todavía (issue 289: catálogo deja el terreno listo), pero
      # `aplicar_credenciales_proveedor` (issue 04) SÍ las escribe en el
      # `.env` real desde /administracion/proveedores -- faltaban acá
      # (issue 292, encontrado al verificar el guardado de punta a punta
      # contra el servidor real): sin este bloque, el `.env` queda
      # correcto pero la variable es invisible para `os.environ` dentro
      # del contenedor, sin importar cuántas veces se reinicie.
      META_APP_ID: ${META_APP_ID}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_BUSINESS_ACCOUNT_ID: ${META_BUSINESS_ACCOUNT_ID}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      PXB_HOST: ${PXB_HOST}
      PXB_PUERTO: ${PXB_PUERTO}
      PXB_USUARIO: ${PXB_USUARIO}
      PXB_SECRETO: ${PXB_SECRETO}
      PXB_EXTENSION_ORIGEN: ${PXB_EXTENSION_ORIGEN}
      # S3 para fotos de paquete (S3FotoStorage) — bucket DEDICADO de staging
      # (paquetex-staging-fotos), separado del bucket real de producción a
      # propósito (mismo aislamiento que el resto del entorno de staging).
      # AWS_S3_ACCESS_KEY_ID/SECRET son variables DISTINTAS de las genéricas
      # AWS_ACCESS_KEY_ID/SECRET de arriba (esas ya sirven al fallback de SNS,
      # usuario IAM paquetex-sns-publisher) — reusarlas pisaría esas
      # credenciales con las de un usuario IAM distinto, con permiso
      # exclusivo sobre este bucket. Definidas en .env local, NO versionadas.
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID}
      AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY}
      # Origen público para enlaces absolutos en correos (recuperación de
      # contraseña) -- uvicorn corre sin --proxy-headers detrás de Caddy, así
      # que request.base_url no es confiable para el esquema (ver
      # public_base_url() en app/web/config.py). Literal, no ${...}: es
      # inherente a ESTE despliegue, igual que WEB_ENV arriba.
      PUBLIC_BASE_URL: https://test.papyrus.com.co
      # Cuenta SMTP dedicada de staging (paquetex@papyrus.com.co, MXroute) --
      # definidas en .env local, NO versionadas. Sin SMTP_HOST/USER/PASSWORD/
      # FROM_EMAIL, la app cae sola a ConsoleEmailSender (ver
      # smtp_email_sender.configurado()).
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USE_SSL: ${SMTP_USE_SSL}
      # Override fail-closed de correo (StagingOverrideEmailSender) -- a
      # diferencia de SMS_OVERRIDE_NUMBER, esta variable tiene un default en
      # código (jesus@jemavi.co) si falta -- ver app/web/password_reset.py.
      EMAIL_OVERRIDE_ADDRESS: ${EMAIL_OVERRIDE_ADDRESS}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  pg_password:
    environment: PG_PASSWORD

volumes:
  pgdata:
  caddy_data:
  caddy_config:

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: paquetex
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paquetex"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "staging", no "production": este servidor es staging (test.papyrus.com.co).
      # Con WEB_ENV=staging, el envío de notificaciones queda fail-closed
      # (StagingOverrideSender) el día que se conecte un proveedor real — ver
      # docs/refactoring/REFERENCIA_FUNCIONAL_APLICATIVO.md §10.
      WEB_ENV: staging
      DATABASE_URL: postgresql://paquetex:${PG_PASSWORD}@db:5432/paquetex
      SECRET_KEY: ${SECRET_KEY}
      # Override fail-closed (StagingOverrideSender): sin esta variable, cero
      # envíos aunque haya un proveedor real conectado. Definida en .env local.
      SMS_OVERRIDE_NUMBER: ${SMS_OVERRIDE_NUMBER}
      # Credenciales LIWA (conector real de SMS) — definidas en .env local, NO
      # versionadas. Sin estas, la app cae sola a Console/DevOtpSender.
      LIWA_API_KEY: ${LIWA_API_KEY}
      LIWA_ACCOUNT: ${LIWA_ACCOUNT}
      LIWA_PASSWORD: ${LIWA_PASSWORD}
      LIWA_AUTH_URL: ${LIWA_AUTH_URL}
      # Credenciales Twilio (respaldo de SMS si LIWA no responde) — definidas
      # en .env local, NO versionadas. Sin las tres, Twilio no entra a la
      # cadena de precedencia (ver twilio_sender.configurado()).
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID}
      # AWS SNS (tercer respaldo de SMS) — usa el rol IAM de Lightsail para
      # las credenciales, esta bandera solo habilita el proveedor.
      AWS_SNS_SMS_ENABLED: ${AWS_SNS_SMS_ENABLED}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  pg_password:
    environment: PG_PASSWORD

volumes:
  pgdata:
  caddy_data:
  caddy_config:

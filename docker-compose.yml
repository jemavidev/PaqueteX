services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: paquetex
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paquetex"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "staging", no "production": este servidor es staging (test.papyrus.com.co).
      # Con WEB_ENV=staging, el envío de notificaciones queda fail-closed
      # (StagingOverrideSender) el día que se conecte un proveedor real — ver
      # docs/refactoring/REFERENCIA_FUNCIONAL_APLICATIVO.md §10.
      WEB_ENV: staging
      DATABASE_URL: postgresql://paquetex:${PG_PASSWORD}@db:5432/paquetex
      SECRET_KEY: ${SECRET_KEY}
      # Override fail-closed (StagingOverrideSender): sin esta variable, cero
      # envíos aunque haya un proveedor real conectado. Definida en .env local.
      SMS_OVERRIDE_NUMBER: ${SMS_OVERRIDE_NUMBER}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  pg_password:
    environment: PG_PASSWORD

volumes:
  pgdata:
  caddy_data:
  caddy_config:
